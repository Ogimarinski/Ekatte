<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekatte - Вход</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1 class="header auth-header">EKATTE</h1>
        <h2 class="auth-title">Вход</h2>

        <div id="formMessage" class="form-message hidden"></div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="email">Имейл</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field-group">
            <label for="password">Парола</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              minlength="8"
              maxlength="100"
              required
            />
            <span class="field-error" id="passwordError"></span>
          </div>

          <button type="submit" id="submitBtn" class="btn auth-submit">
            Влез
          </button>
        </form>

        <div id="resendSection" class="resend-section hidden">
          <p>Профилът не е потвърден.</p>
          <button type="button" id="resendBtn" class="btn auth-secondary">
            Изпрати писмо за потвърждение
          </button>
        </div>

        <p class="auth-switch">
          Нямаш акаунт?
          <a href="/register.html">Регистрирай се</a>
        </p>
      </div>
    </div>
    <script type="module" src="./js/auth/login.js" defer></script>
  </body>
</html>
