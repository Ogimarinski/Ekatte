services:
  app:
    build: .
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - climate-data:/app/data
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./db/01_tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata18:
  node_modules:
  climate-data:
